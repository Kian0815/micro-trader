services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: microtrader
      POSTGRES_USER: microtrader
      POSTGRES_PASSWORD: microtrader
    ports:
      - "${DB_PORT_BIND:-127.0.0.1:5432:5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microtrader -d microtrader"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_PORT_BIND:-8000:8000}"
    volumes:
      - ./state:/app/state:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
    command: python -m app.worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./state:/app/state
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
